<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Intro — dev harness</title>
    <style>
      /* Simulates the host (Webflow) page underneath the intro. */
      body { margin: 0; font-family: system-ui, sans-serif; background: #101418; color: #dfe6e8; }
      main { min-height: 200vh; padding: 12vh 8vw; }
      h1 { font-weight: 500; letter-spacing: -0.02em; }

      /* Critical CSS — see deploy/index.html for the full explanation.
         Covers the viewport before the module script has even run, so
         there's no flash of host content while it loads/mounts. */
      [data-ocean-intro] {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- No container div needed — mount.js creates [data-ocean-intro]
         itself (as the first element in body) if one isn't already
         present. Only the critical CSS above + the script are required. -->
    <main>
      <h1>Host website content</h1>
      <p>This is the page revealed after the intro completes. Add ?intro=force to the URL to replay the intro after completion.</p>
    </main>

    <script type="module">
      import OceanIntro from '/src/index.js';
      OceanIntro.init({
        // Any config/defaults.js key can be overridden here per client.
        once: false,
        debug: true,
      });
    </script>
  </body>
</html>
