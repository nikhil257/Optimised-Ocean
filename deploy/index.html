<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Intro — live demo</title>
    <style>
      /* Simulates the host (Webflow) page underneath the intro. */
      body { margin: 0; font-family: system-ui, sans-serif; background: #101418; color: #dfe6e8; }
      main { min-height: 200vh; padding: 12vh 8vw; }
      h1 { font-weight: 500; letter-spacing: -0.02em; }
    </style>
  </head>
  <body>
    <!-- The only two things a Webflow site needs: this container + the script. -->
    <div data-ocean-intro></div>

    <main>
      <h1>Host website content</h1>
      <p>This is the page revealed after the intro completes. Add ?intro=force to the URL to replay the intro after completion.</p>
    </main>

    <!--
      Production embed, exactly as documented in src/index.js: the built IIFE
      bundle (window.OceanIntro). Normally this would just be
      <script src="/ocean-intro.js" data-auto-init></script> — auto-init with
      defaults, no overrides. TEMPORARILY switched to an explicit init() call
      with debug:true so the on-screen quality-tier readout shows up here
      while diagnosing the Windows performance issue. Revert to the
      data-auto-init form once that's done.
    -->
    <script src="/ocean-intro.js"></script>
    <script>
      window.OceanIntro.init({ debug: true });
    </script>
  </body>
</html>
